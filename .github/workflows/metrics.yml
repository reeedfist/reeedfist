name: 📊 Metrics card

# Este workflow gera o card grande de estatísticas (linguagens, atividade, calendário)
# e commita em profile/metrics.svg — nada é buscado de terceiros na hora da visita.
#
# PRÉ-REQUISITO: criar um Personal Access Token e salvar como secret METRICS_TOKEN.
# Passo a passo no SETUP.md. Sem o secret, o job simplesmente não roda (não quebra nada).

on:
  schedule:
    - cron: "30 6 * * *"     # todo dia às 03:30 em Curitiba
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar se o token existe
        id: check
        run: |
          if [ -n "${{ secrets.METRICS_TOKEN }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Secret METRICS_TOKEN nao configurado — pulando. Veja o SETUP.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar metrics.svg
        if: steps.check.outputs.ok == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: profile/metrics.svg
          committer_branch: main
          base: header, activity, repositories
          config_timezone: America/Sao_Paulo
          config_display: large
          template: classic
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
